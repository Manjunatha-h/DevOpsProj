services:
  backend:
    build:
      context: ./email-writer-sb
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    restart: unless-stopped

  frontend:
    build:
      context: ./email-writer-react
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://backend:8080
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
